<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Гео-Квест</title>
    <!-- Подключаем стили карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; z-index: 1; }
        #ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 400px; background: white;
            padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center; box-sizing: border-box;
        }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; 
                 border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
        h3 { margin: 0 0 8px 0; color: #333; }
        p { margin: 0 0 12px 0; color: #666; font-size: 14px; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-panel">
        <h3 id="quest-title">Поиск сигналов GPS...</h3>
        <p id="quest-desc">Пожалуйста, разрешите доступ к геопозиции и стойте на открытом месте.</p>
        <button id="action-btn" disabled>Взаимодействовать</button>
    </div>

    <!-- Подключаем библиотеку Leaflet -->
    <script src="https://unpkg.com"></script>
    
    <script>
        // === НАСТРОЙКА SUPABASE ===
        const SUPABASE_URL = "https://supabase.com/dashboard/project/uitjtiujqfypylnjcqsr";
        const SUPABASE_KEY = "sb_publishable_IcXVAwtbswi8flRAM17-Aw_AyPhgpxD";

        let map, playerMarker, playerRadius;
        let quests = [];
        let activeQuest = null;
        const ACTIVATION_RADIUS = 20; // Радиус активации квеста в метрах

        // Инициализация карты (по умолчанию центр на Москву, пока нет GPS)
        map = L.map('map', { zoomControl: false }).setView([55.7558, 37.6173], 15);
        
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CartoDB',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);
        
        // Функция загрузки точек из Supabase
        async function loadQuests() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/quests?select=*`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                quests = await response.json();
                
                // Рисуем квесты на карте
                quests.forEach(quest => {
                    // Зеленый круг — зона квеста
                    L.circle([quest.latitude, quest.longitude], {
                        color: '#28a745',
                        fillColor: '#28a745',
                        fillOpacity: 0.2,
                        radius: ACTIVATION_RADIUS
                    }).addTo(map);

                    // Метка в центре зоны
                    L.marker([quest.latitude, quest.longitude])
                     .addTo(map)
                     .bindPopup(`<b>${quest.title}</b>`);
                });
            } catch (err) {
                console.error("Ошибка загрузки квестов:", err);
            }
        }

        // Функция вычисления расстояния между двумя координатами (Формула Гаверсинуса)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Радиус Земли в метрах
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; // Расстояние в метрах
        }

        // Отслеживание местоположения игрока
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                enableHighAccuracy: true, // Использовать GPS, а не вышки сотовой связи
                maximumAge: 1000,         // Обновлять раз в секунду
                timeout: 5000
            });
        } else {
            alert("Ваш браузер не поддерживает GPS.");
        }

        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // Если маркер игрока еще не создан — создаем
            if (!playerMarker) {
                playerMarker = L.marker([lat, lng], {
                    icon: L.icon({
                        iconUrl: 'https://flaticon.com', // Иконка радара/точки
                        iconSize:,
                        iconAnchor: [15, 15]
                    })
                }).addTo(map);

                playerRadius = L.circle([lat, lng], {
                    radius: ACTIVATION_RADIUS,
                    color: '#007bff',
                    fillColor: '#007bff',
                    fillOpacity: 0.15
                }).addTo(map);

                map.setView([lat, lng], 17); // Фокусируем карту на игроке
                loadQuests(); // Загружаем точки из базы данных
            } else {
                // Обновляем позицию игрока
                playerMarker.setLatLng([lat, lng]);
                playerRadius.setLatLng([lat, lng]);
            }

            checkGameZones(lat, lng);
        }

        function onLocationError(error) {
            console.warn(`Ошибка GPS (${error.code}): ${error.message}`);
        }

        // Проверяем, зашел ли игрок в какую-либо игровую зону
        function checkGameZones(playerLat, playerLng) {
            let insideZone = false;

            for (let quest of quests) {
                const distance = getDistance(playerLat, playerLng, quest.latitude, quest.longitude);

                if (distance <= ACTIVATION_RADIUS) {
                    insideZone = true;
                    activeQuest = quest;
                    
                    document.getElementById('quest-title').innerText = `📍 Достигнута точка: ${quest.title}`;
                    document.getElementById('quest-desc').innerText = "Вы подошли достаточно близко! Нажмите кнопку, чтобы получить задание.";
                    document.getElementById('action-btn').disabled = false;
                    break;
                }
            }

            if (!insideZone) {
                activeQuest = null;
                document.getElementById('quest-title').innerText = "🗺️ Исследуйте местность";
                document.getElementById('quest-desc').innerText = "Ищите зеленые зоны на карте. Подойдите к ним ближе чем на 20 метров.";
                document.getElementById('action-btn').disabled = true;
            }
        }

        // Клик по кнопке действия при нахождении в зоне квеста
        document.getElementById('action-btn').addEventListener('click', () => {
            if (activeQuest) {
                alert(`📜 ЗАДАНИЕ:\n\n${activeQuest.description}`);
            }
        });
    </script>
</body>
</html>
