<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Гео-Квест</title>
    
    <!-- ПОДКЛЮЧАЕМ СВЕРХНАДЕЖНЫЙ CDN ОТ ЯНДЕКСА -->
    <link rel="stylesheet" href="https://yastatic.net" />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; z-index: 1; background: #e5e3df; }
        #ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 400px; background: white;
            padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center; box-sizing: border-box;
        }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; 
                 border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; }
        button:disabled { background: #ccc; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; 
                border-radius: 6px; box-sizing: border-box; font-size: 16px; display: none; }
        h3 { margin: 0 0 8px 0; color: #333; }
        p { margin: 0 0 12px 0; color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-panel">
        <h3 id="quest-title">Настройка карт...</h3>
        <p id="quest-desc">Загружаем слои карты и проверяем датчики.</p>
        <input type="text" id="answer-input" placeholder="Введите ваш ответ...">
        <button id="action-btn" disabled>Открыть задание</button>
    </div>

    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpdGp0aXVqcWZ5cHlsbmpjcXNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5OTQzOTAsImV4cCI6MjEwODU3MDM5MH0.1jRd_cafA4b8zXNbVYhlXLMCZauXdQQd0C7olu_NgG8";

        // === КООРДИНАТЫ ДЛЯ ТЕСТОВ ДОМА ===
        // Замени эти цифры на координаты своего реального дома!
        const HOME_LAT = 55.7558; 
        const HOME_LNG = 37.6173;

        let map, playerMarker, playerRadius;
        let quests = [];
        let activeQuest = null;
        let isQuestOpened = false;
        const ACTIVATION_RADIUS = 20; 

        window.onload = function() {
            // Инициализируем карту через полную библиотеку Leaflet
            map = L.map('map', { zoomControl: false }).setView([HOME_LAT, HOME_LNG], 16);
            
            // Загружаем подложку Яндекс.Карт
            L.tileLayer('https://yandex.net{x}&y={y}&z={z}&scale=1&lang=ru_RU', {
                maxZoom: 18,
                attribution: '© Яндекс.Карты'
            }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                    enableHighAccuracy: true, maximumAge: 1000, timeout: 8000
                });
            } else {
                activateSimulator("Браузер не поддерживает геопозицию");
            }
        };

        async function loadQuests() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/quests?select=*`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                quests = await response.json();
                
                quests.forEach(quest => {
                    L.circle([quest.latitude, quest.longitude], {
                        color: '#28a745', fillColor: '#28a745', fillOpacity: 0.2, radius: ACTIVATION_RADIUS
                    }).addTo(map);

                    L.marker([quest.latitude, quest.longitude]).addTo(map).bindPopup(`<b>${quest.title}</b>`);
                });
            } catch (err) {
                console.error("Ошибка базы данных:", err);
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            updatePlayerMarker(lat, lng);
        }

        function onLocationError(error) {
            console.warn("GPS недоступен. Переключаемся на симулятор...");
            activateSimulator("Симулятор активен (Поиск спутников...)");
        }

        function activateSimulator(statusMessage) {
            updatePlayerMarker(HOME_LAT, HOME_LNG);
            document.getElementById('quest-desc').innerText = statusMessage;
        }

        function updatePlayerMarker(lat, lng) {
            if (!playerMarker) {
                playerMarker = L.marker([lat, lng]).addTo(map);
                playerRadius = L.circle([lat, lng], { radius: ACTIVATION_RADIUS, color: '#007bff', fillOpacity: 0.15 }).addTo(map);
                map.setView([lat, lng], 17);
                loadQuests(); 
            } else {
                playerMarker.setLatLng([lat, lng]);
                playerRadius.setLatLng([lat, lng]);
            }

            if (!isQuestOpened) {
                checkGameZones(lat, lng);
            }
        }

        function checkGameZones(playerLat, playerLng) {
            let insideZone = false;

            for (let quest of quests) {
                const distance = getDistance(playerLat, playerLng, quest.latitude, quest.longitude);

                if (distance <= ACTIVATION_RADIUS) {
                    insideZone = true;
                    activeQuest = quest;
                    
                    document.getElementById('quest-title').innerText = `📍 В игровой зоне: ${quest.title}`;
                    document.getElementById('quest-desc').innerText = "Вы на точке! Нажмите кнопку, чтобы прочесть загадку.";
                    document.getElementById('action-btn').disabled = false;
                    break;
                }
            }

            if (!insideZone) {
                activeQuest = null;
                document.getElementById('quest-title').innerText = "🗺️ Исследуйте местность";
                document.getElementById('quest-desc').innerText = "Ищите зеленые круги. Переместитесь в них.";
                document.getElementById('action-btn').disabled = true;
                document.getElementById('action-btn').innerText = "Открыть задание";
                document.getElementById('answer-input').style.display = "none";
            }
        }

        document.getElementById('action-btn').addEventListener('click', () => {
            const btn = document.getElementById('action-btn');
            const input = document.getElementById('answer-input');

            if (!isQuestOpened && activeQuest) {
                document.getElementById('quest-desc').innerText = `📜 ЗАГАДКА:\n${activeQuest.description}`;
                input.style.display = "block";
                btn.innerText = "Проверить ответ";
                isQuestOpened = true;
            } else if (isQuestOpened && activeQuest) {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = String(activeQuest.answer).trim().toLowerCase();
                
                if (userAnswer === correctAnswer) { 
                    alert("🎉 Правильный ответ!");
                    document.getElementById('quest-title').innerText = "✅ Пройдено!";
                    document.getElementById('quest-desc').innerText = "Отлично! Квест выполнен.";
                    input.style.display = "none";
                    btn.disabled = true;
                    btn.innerText = "Выполнено";
                } else {
                    alert("❌ Ответ неверный, попробуй еще раз!");
                }
            }
        });
    </script>
</body>
</html>
