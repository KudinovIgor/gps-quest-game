<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Трекер: Квест</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: monospace; background: #070b12; color: #00e5ff; overflow: hidden; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        canvas { width: 100%; height: 100%; display: block; }
        #ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 400px; background: rgba(10, 20, 38, 0.9);
            border: 2px solid #00e5ff; padding: 15px; border-radius: 12px; 
            box-shadow: 0 0 20px rgba(0,229,255,0.3); text-align: center; box-sizing: border-box;
        }
        button { background: #00e5ff; color: #070b12; border: none; padding: 12px 20px; 
                 border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; font-family: inherit; text-transform: uppercase; }
        button:disabled { background: #102a36; color: #005b66; cursor: not-allowed; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #00e5ff; 
                background: #070b12; color: #00e5ff; border-radius: 6px; box-sizing: border-box; font-size: 16px; display: none; text-align: center; font-family: inherit; }
        h3 { margin: 0 0 8px 0; letter-spacing: 1px; }
        p { margin: 0 0 12px 0; color: #8ab4f8; font-size: 13px; line-height: 1.3; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="ui-panel">
        <h3 id="quest-title">СИНХРОНИЗАЦИЯ...</h3>
        <p id="quest-desc">Подключение к спутникам позиционирования.</p>
        <input type="text" id="answer-input" placeholder="ВВЕДИТЕ ОТВЕТ...">
        <button id="action-btn" disabled>Открыть терминал</button>
    </div>

    <script>
        // === ВНИМАНИЕ: ВСТАВЬ СЮДА СВОИ ДАННЫЕ ВМЕСТО ШАБЛОННЫХ ===
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpdGp0aXVqcWZ5cHlsbmpjcXNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5OTQzOTAsImV4cCI6MjEwODU3MDM5MH0.1jRd_cafA4b8zXNbVYhlXLMCZauXdQQd0C7olu_NgG8";

        // === ТВОИ ДОМАШНИЕ КООРДИНАТЫ ДЛЯ ТЕСТА ===
        const HOME_LAT = 55.7558; 
        const HOME_LNG = 37.6173;

        let canvas, ctx;
        let quests = [];
        let activeQuest = null;
        let isQuestOpened = false;
        const ACTIVATION_RADIUS = 20; 
        
        let playerPos = { lat: HOME_LAT, lng: HOME_LNG };
        let scale = 150000; // Увеличили масштаб для лучшей видимости точек

        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            loadQuests();

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => { playerPos.lat = pos.coords.latitude; playerPos.lng = pos.coords.longitude; updateGame(); },
                    () => { updateGame(); }, 
                    { enableHighAccuracy: true, maximumAge: 1000 }
                );
            } else {
                updateGame();
            }
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }

        async function loadQuests() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/quests?select=*`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                if (!response.ok) throw new Error("Сбой сети или ключей");
                quests = await response.json();
                updateGame();
            } catch (err) {
                console.error(err);
                document.getElementById('quest-desc').innerText = "ОШИБКА БАЗЫ ДАННЫХ.\nПроверьте API-ключи в коде.";
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateGame() {
            checkGameZones(playerPos.lat, playerPos.lng);
            draw();
        }

        function checkGameZones(pLat, pLng) {
            if(quests.length === 0) return;
            let insideZone = false;

            for (let quest of quests) {
                const distance = getDistance(pLat, pLng, quest.latitude, quest.longitude);

                if (distance <= ACTIVATION_RADIUS) {
                    insideZone = true;
                    activeQuest = quest;
                    document.getElementById('quest-title').innerText = `• ОБЪЕКТ РЯДОМ •`;
                    document.getElementById('quest-desc').innerText = `Зона: ${quest.title}\nДистанция: ${Math.round(distance)}м.`;
                    if (!isQuestOpened) document.getElementById('action-btn').disabled = false;
                    break;
                }
            }

            if (!insideZone) {
                activeQuest = null;
                document.getElementById('quest-title').innerText = `СКАНИРОВАНИЕ ЗОН`;
                document.getElementById('quest-desc').innerText = `Двигайтесь к точкам на тактическом экране.`;
                document.getElementById('action-btn').disabled = true;
                document.getElementById('action-btn').innerText = "Открыть терминал";
                document.getElementById('answer-input').style.display = "none";
                isQuestOpened = false;
            }
        }

        function draw() {
            if (!ctx) return;
            
            ctx.fillStyle = "#070b12";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Сетка
            ctx.strokeStyle = "rgba(0, 229, 255, 0.05)";
            ctx.lineWidth = 1;
            const gridStep = 40;
            for(let x = 0; x < canvas.width; x += gridStep) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for(let y = 0; y < canvas.height; y += gridStep) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            // Исправленные круги радара
            ctx.strokeStyle = "rgba(0, 229, 255, 0.15)";
            [40, 80, 120, 160].forEach(r => {
                ctx.beginPath(); ctx.arc(centerX, centerY, r, 0, Math.PI*2); ctx.stroke();
            });

            // Отображение точек
            quests.forEach(quest => {
                const qX = centerX + (quest.longitude - playerPos.lng) * scale;
                const qY = centerY - (quest.latitude - playerPos.lat) * scale;

                ctx.fillStyle = "rgba(0, 255, 102, 0.15)";
                ctx.strokeStyle = "#00ff66";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(qX, qY, 15, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#00ff66";
                ctx.font = "10px monospace";
                ctx.fillText(quest.title, qX + 20, qY + 4);
            });

            // Маркер игрока
            ctx.fillStyle = "#00e5ff";
            ctx.beginPath();
            ctx.arc(centerX, centerY, 6, 0, Math.PI*2);
            ctx.fill();
        }

        document.getElementById('action-btn').addEventListener('click', () => {
            const btn = document.getElementById('action-btn');
            const input = document.getElementById('answer-input');

            if (!isQuestOpened && activeQuest) {
                document.getElementById('quest-desc').innerText = `ВХОДЯЩИЕ ДАННЫЕ:\n${activeQuest.description}`;
                input.style.display = "block";
                btn.innerText = "ПОДТВЕРДИТЬ КОД";
                isQuestOpened = true;
            } else if (isQuestOpened && activeQuest) {
                const userAnswer = input.value.trim().toLowerCase();
                const correctAnswer = String(activeQuest.answer).trim().toLowerCase();
                
                if (userAnswer === correctAnswer) { 
                    alert("ДОСТУП РАЗРЕШЕН!");
                    document.getElementById('quest-title').innerText = "• ВЫПОЛНЕНО •";
                    document.getElementById('quest-desc').innerText = "Сектор зачищен успешно.";
                    input.style.display = "none";
                    btn.disabled = true;
                    btn.innerText = "СДЕЛАНO";
                } else {
                    alert("НЕВЕРНЫЙ КОД ДОСТУПА!");
                }
            }
        });
    </script>
</body>
</html>
